<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="container">
        <div>
            <h1>Feedback Form</h1>
            <p>Please fill the form below to send a message</p>
        </div>
        <div>
            <legend></legend>
                <form method="POST">
                    <span>Sur Name:</span>
                    &nbsp;<input type="text" placeholder="Enter sur name" name="Mame" required>
                    <span>First Name:</span> 
                    &nbsp;<input type="text" placeholder="Enter first name" name="Mame" required>
                    <span>Other Name:</span> 
                    &nbsp;<input type="text" placeholder="Enter other name" name="Mame" required>
                    <span>Phone Number:</span>
                    &nbsp;<input type="number" placeholder="Enter phone number" name="Number" required>
                    <span>Email:</span>
                    &nbsp;<input type="email" placeholder="Enter e-mail" name="Email" required>
                    <span>Message:</span>
                    &nbsp;<textarea name="Message" placeholder="Message" required></textarea>
                    <button type="submit">Send</button>
            
                </form>
            </legend>    
        </div>    
    </div>
</body>
</html>
